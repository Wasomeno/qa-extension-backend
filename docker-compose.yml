services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_ADDR=redis:6379
      - APP_ENV=${APP_ENV}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - GITLAB_REDIRECT_URI=${GITLAB_REDIRECT_URI}
      # Pi fix agent configuration
      - PI_BINARY_PATH=/root/.local/share/pi-node/node-v22.22.3-linux-x64/bin/pi
      - PI_MODEL=${PI_MODEL:-}
      - FIX_AGENT_TIMEOUT_MINUTES=${FIX_AGENT_TIMEOUT_MINUTES:-30}
      # Claude Code API configuration
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      # GitLab OAuth configuration
      - GITLAB_BASE_URL=${GITLAB_BASE_URL:-https://gitlab.com}
      - GITLAB_APPLICATION_ID=${GITLAB_APPLICATION_ID}
      - GITLAB_SECRET=${GITLAB_SECRET}
      # Local Git repository cache for AI agent code reads/searches
      - REPO_CACHE_ENABLED=${REPO_CACHE_ENABLED:-true}
      - REPO_CACHE_DIR=/var/cache/qa-extension/repos
      - REPO_CACHE_SYNC_TTL=${REPO_CACHE_SYNC_TTL:-15m}
      - REPO_CACHE_MAX_SYNC_CONCURRENCY=${REPO_CACHE_MAX_SYNC_CONCURRENCY:-3}
      - REPO_CACHE_SEARCH_LIMIT=${REPO_CACHE_SEARCH_LIMIT:-50}
      # E2E generation queue and OpenAI throttling
      - GENERATION_QUEUE_WORKERS=${GENERATION_QUEUE_WORKERS:-2}
      - GENERATION_GLOBAL_INFLIGHT=${GENERATION_GLOBAL_INFLIGHT:-3}
      - GENERATION_OPENAI_RPM=${GENERATION_OPENAI_RPM:-30}
      - GENERATION_OPENAI_TPM=${GENERATION_OPENAI_TPM:-120000}
      - GENERATION_JOB_LEASE_SECONDS=${GENERATION_JOB_LEASE_SECONDS:-900}
      - GENERATION_JOB_MAX_ATTEMPTS=${GENERATION_JOB_MAX_ATTEMPTS:-1}
      - GENERATION_OPENAI_MAX_ATTEMPTS=${GENERATION_OPENAI_MAX_ATTEMPTS:-3}
    user: root
    expose:
      - "3000"
    depends_on:
      - redis
    volumes:
      - /root/.local/share/pi-node:/root/.local/share/pi-node:ro
      - /root/.pi:/root/.pi
      - repo_cache_data:/var/cache/qa-extension/repos
    networks:
      - dokploy-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - dokploy-network

  redis-flush:
    image: redis:7-alpine
    profiles:
      - maintenance
    depends_on:
      - redis
    command: ["redis-cli", "-h", "redis", "-p", "6379", "-n", "0", "FLUSHDB", "ASYNC"]
    networks:
      - dokploy-network

volumes:
  redis_data:
  repo_cache_data:

networks:
  dokploy-network:
    external: true
