services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_ADDR=redis:6379
      - APP_ENV=${APP_ENV}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - GITLAB_REDIRECT_URI=${GITLAB_REDIRECT_URI}
      # Pi fix agent configuration
      - PI_BINARY_PATH=/root/.local/share/pi-node/node-v22.22.3-linux-x64/bin/pi
      - PI_MODEL=${PI_MODEL:-}
      - FIX_AGENT_TIMEOUT_MINUTES=${FIX_AGENT_TIMEOUT_MINUTES:-30}
      # Claude Code API configuration
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      # GitLab OAuth configuration
      - GITLAB_BASE_URL=${GITLAB_BASE_URL:-https://gitlab.com}
      - GITLAB_APPLICATION_ID=${GITLAB_APPLICATION_ID}
      - GITLAB_SECRET=${GITLAB_SECRET}
    user: root
    expose:
      - "3000"
    depends_on:
      - redis
    volumes:
      - /root/.local/share/pi-node:/root/.local/share/pi-node:ro
    networks:
      - dokploy-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - dokploy-network

volumes:
  redis_data:

networks:
  dokploy-network:
    external: true
